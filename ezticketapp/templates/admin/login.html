{% extends 'base.html' %}

{% block title %}Đăng nhập Quản trị viên (Admin) - EzTicket{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth/auth.css') }}">
<style>
    .auth-form-wrapper-admin {
        border: 3px solid #0b5ed7 !important;
        box-shadow: 0 12px 36px rgba(11, 94, 215, 0.18) !important;
    }

    .auth-title-admin {
        color: #0b5ed7 !important;
    }

    .btn-auth-submit-admin {
        background-color: #0b5ed7 !important;
    }

    .btn-auth-submit-admin:hover {
        background-color: #083c7a !important;
        box-shadow: 0 4px 12px rgba(11, 94, 215, 0.4) !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form-wrapper auth-form-wrapper-admin">
        <div class="text-center mb-3">
            <span
                class="badge bg-primary bg-opacity-10 text-primary fw-bold px-3 py-2 rounded-pill fs-6 border border-primary-subtle">
                <i class="fa-solid fa-user-shield me-1"></i>ADMIN PORTAL
            </span>
        </div>
        <h1 class="auth-title auth-title-admin mb-4">Đăng nhập Admin</h1>

        <form action="{{ url_for('admin_login', next=request.args.get('next', '')) }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">Email Admin</label>
                <input type="email" id="email" name="email" class="form-control form-control-auth"
                    placeholder="Nhập email quản trị viên (admin@example.com)" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu Admin</label>
                <input type="password" id="password" name="password" class="form-control form-control-auth"
                    placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn-auth-submit btn-auth-submit-admin mt-2">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập Quản trị
            </button>
        </form>

        <div class="auth-switch mt-4">
            <p><a href="{{ url_for('home') }}" class="auth-switch-link text-decoration-none"><i
                        class="fa-solid fa-house me-1"></i>Quay lại trang chủ EzTicket</a></p>
        </div>
    </div>
</div>
{% endblock %}
