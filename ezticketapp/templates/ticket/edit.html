{% extends 'layout/base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>

                Chỉnh sửa vé

            </h3>

        </div>

        <div class="card-body">

            <form method="post">

                <div class="mb-3">

                    <label>

                        Loại vé

                    </label>

                    <select
                            class="form-select"
                            name="ticket_type">

                        {% for t in ticket_types %}

                        <option
                                value="{{ t.id }}"
                                {% if ticket.ticket_type_id==t.id %}
                                selected
                                {% endif %}
                        >

                            {{ t.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>

                        Giá

                    </label>

                    <input
                            class="form-control"
                            type="number"
                            name="price"
                            value="{{ ticket.price }}">

                </div>

                <div class="mb-3">

                    <label>

                        Số lượng

                    </label>

                    <input
                            class="form-control"
                            type="number"
                            name="quantity"
                            value="{{ ticket.quantity }}">

                </div>

                <button
                        class="btn btn-primary">

                    Cập nhật

                </button>

                <a
                        class="btn btn-secondary"
                        href="{{ url_for('event_ticket_list',event_id=ticket.event_id) }}">

                    Quay lại

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
