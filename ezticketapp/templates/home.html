{% extends 'base.html' %}

{% block content %}
<div class="container">
    {% if current_user.is_authenticated %}
        <div class="d-flex align-items-center mb-4">
            <img src="{{ current_user.avatar }}" alt="{{ current_user.full_name }}" class="rounded-circle" style="width:80px; height:80px; object-fit:cover; margin-right:16px;" />
            <div>
                <h2>Xin chào, {{ current_user.full_name }}!</h2>
                <p>Bạn đã đăng nhập thành công. Chúc bạn một ngày trải nghiệm tốt với EzTicket.</p>
            </div>
        </div>
        <div class="filter-field">
          <label>Loại vé</label>
          <select name="ticket_type">
            <option value="">Tất cả vé</option>
            {% for ticket in ticket_types %}
            <option value="{{ ticket.id }}" {% if request.args.get('ticket_type','') == ticket.id|string %}selected{% endif %}>{{ ticket.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="filter-field">
          <label>Địa điểm</label>
          <input type="text" name="location" value="{{ request.args.get('location','') }}" placeholder="Nhập địa điểm">
        </div>
        <div class="filter-field filter-actions">
          <button type="submit" class="button-secondary">Áp dụng bộ lọc</button>
          <a href="{{ url_for('home') }}" class="button-secondary clear-button">Xóa bộ lọc</a>
        </div>
      </div>
    </form>
  </section>

  <div id="event-list-target">
    {% include '_event_list.html' %}
  </div>
{% endblock %}
