{% extends "organizer/organizer_base.html" %}

{% block title %}
Xác thực vé
{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-header">
        <h4 class="mb-0">Xác thực vé</h4>
    </div>
    <div class="card-body">
        <div id="verification-loading" class="alert alert-info" style="display:none;">Đang xử lý...</div>
        <div id="verification-result"></div>

        <div id="verification-step-qr">
            <h5>Bước 1: Quét mã QR</h5>
            <button id="btnScanQr" class="btn btn-primary mb-3">Mở camera QR</button>
            <div id="verification-qr-capture" style="display:none;">
                <video id="verification-qr-video" autoplay playsinline class="rounded" style="max-width:100%; max-height:320px;"></video>
                <canvas id="verification-qr-canvas" style="display:none;"></canvas>
                <div class="mt-2">
                    <button id="btnCaptureQr" class="btn btn-success">Chụp mã QR</button>
                </div>
            </div>
        </div>

        <div id="verification-step-face" style="display:none;">
            <hr>
            <h5>Bước 2: Xác thực khuôn mặt</h5>
            <button id="btnScanFace" class="btn btn-outline-primary mb-3" disabled>Mở camera khuôn mặt</button>
            <div id="verification-face-capture" style="display:none;">
                <video id="verification-face-video" autoplay playsinline class="rounded" style="max-width:100%; max-height:320px;"></video>
                <canvas id="verification-face-canvas" style="display:none;"></canvas>
                <div class="mt-2">
                    <button id="btnCaptureFace" class="btn btn-success">Chụp khuôn mặt</button>
                </div>
            </div>
        </div>

        <div id="verification-summary" class="mt-4" style="display:none;">
            <div class="card border-info">
                <div class="card-body">
                    <h6>Thông tin đơn hàng</h6>
                    <div id="verification-summary-content"></div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button id="btnConfirmVerify" class="btn btn-success" disabled>Xác nhận</button>
            <button id="btnResetVerification" class="btn btn-secondary" style="display:none;">Quét mới</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/ticket-verification.js') }}"></script>
{% endblock %}
