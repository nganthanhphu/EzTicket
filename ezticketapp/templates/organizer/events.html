{% extends "organizer/organizer_base.html" %}

{% block title %}

Quản lý sự kiện

{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">

    <h2 class="mb-0">

        Quản lý sự kiện

    </h2>

    <a href="{{ url_for('organizer_create_event') }}" class="btn btn-primary">

        <i class="fa-solid fa-plus"></i>

        Tạo sự kiện

    </a>

</div>

<table class="table table-hover bg-white shadow">

    <thead>

        <tr>

            <th>

                Tên

            </th>

            <th>

                Ngày

            </th>

            <th>

                Địa điểm

            </th>

            <th>

            </th>

        </tr>

    </thead>

    <tbody>

        {% for e in events %}

        <tr>

            <td>

                {{ e.name }}

            </td>

            <td>

                {{ e.time.strftime("%d/%m/%Y") }}

            </td>

            <td>

                {{ e.location }}

            </td>

            <td>
                <a class="btn btn-danger" href="{{ url_for('organizer_delete_event', event_id=e.id) }}"
                    onclick="return confirm('Bạn có chắc chắn muốn xóa sự kiện này không?');">
                    Xóa
                </a>

                <a class="btn btn-primary" href="{{ url_for('organizer_event_detail', event_id=e.id) }}">
                    Xem
                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
