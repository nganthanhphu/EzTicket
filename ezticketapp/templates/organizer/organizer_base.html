<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>
        {% block title %}
        {% endblock %}
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="{{ url_for('static',
            filename='css/styles.css') }}">

</head>

<body class="bg-light">

<div class="d-flex">

    {% include "organizer/sidebar.html" %}

    <main class="flex-grow-1 p-4">

        {% with messages=get_flashed_messages() %}

        {% if messages %}

        {% for m in messages %}

        <div class="alert alert-success">

            {{ m }}

        </div>

        {% endfor %}

        {% endif %}

        {% endwith %}

        {% block content %}

        {% endblock %}

    </main>

</div>

{% block scripts %}{% endblock %}
</body>

</html>
