

<header class="header">
    <div class="logo">
        <span class="logo-box">Ez</span> Ticket
    </div>

    <div class="search-bar">
        <input type="text" placeholder="nhập sự kiện bạn muốn">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
    </div>

    <div class="user-actions">
        <div class="action-item">
            <div class="icon-circle white-bg">
                <i class="fa-solid fa-ticket ticket-icon"></i>
            </div>
            <span class="action-text">Vé của tôi</span>
        </div>
        <div class="action-item">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('home') }}" class="avatar-link">
                    <img src="{{ current_user.avatar }}" alt="{{ current_user.full_name }}" class="rounded-circle" style="width:40px; height:40px; object-fit:cover;" />
                </a>
                <span id="header-username" class="action-text">{{ current_user.full_name }}</span>
                <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-light text-white ms-2">Đăng xuất</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="avatar-link">
                    <div id="header-avatar" class="icon-circle purple-bg">
                        <i class="fa-regular fa-user user-icon"></i>
                    </div>
                </a>
                <span id="header-username" class="action-text">Login</span>
            {% endif %}
        </div>
    </div>
</header>
